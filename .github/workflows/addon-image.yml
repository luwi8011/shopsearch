# Builds the add-on image and publishes it to GHCR as ghcr.io/<owner>/shopsearch-amd64:<version from config.yaml>,
# the image shopsearch/config.yaml points Home Assistant at. A published version is never rebuilt, so bump the
# version for every release, and move `main` (what Home Assistant reads) only after this has succeeded.
name: Add-on image

on:
  push:
    branches: [work, main]
    paths: ["shopsearch/**", ".github/workflows/addon-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        run: |
          echo "version=$(sed -nE 's/^version: *"?([^"]+)"?/\1/p' shopsearch/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopsearch-amd64" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip versions that are already published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published; bump the version in shopsearch/config.yaml."
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.skip != 'true'
        with:
          context: shopsearch
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: |
            io.hass.name=Shop Search
            io.hass.version=${{ steps.v.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
