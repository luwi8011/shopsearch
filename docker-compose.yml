# shopsearch without Home Assistant OS (plain Docker). With HA OS, install the add-on instead (README).
#   MCP endpoint: http://<host>:8765/mcp   Quick test: curl -H "Authorization: Bearer $API_KEY" 'http://127.0.0.1:8765/api/search?q=...'
#   Settings and secrets go in .env (template .env.example).
services:
  shopsearch:
    build: ./shopsearch
    image: shopsearch:latest
    container_name: shopsearch
    restart: unless-stopped
    ports:
      - "8765:8765"
    shm_size: "1gb"              # Chromium needs more than Docker's 64 MB default
    volumes:
      - ./data:/data             # hunts, learned per-site fetch methods, discovered search URLs, browser cookies
    env_file:
      - path: .env
        required: false
    mem_limit: 3g
